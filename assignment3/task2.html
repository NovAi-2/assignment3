<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.col-box { color: #fff; text-align: center; padding: 60px 10px; border-radius: 8px; font-size: 22px; }</style>
</head>
<body>
  <div class="container py-4">
    <div class="row g-3">
      <!-- mobile: 12 (stacked) | tablet: 6 (2 + 1) | desktop: 4 (3 equal parts) -->
      <div class="col-12 col-md-6 col-lg-4"><div class="col-box bg-primary">Column 1</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="col-box bg-success">Column 2</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="col-box bg-warning">Column 3</div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
